host: archlinux
description: Work Laptop
import: []
enabled_modules:
  - base
  - gaming
  - user-apps
  - user-nvim
  - user-programming
  - niri
packages:
  - fish
  - zsh
exclude: []
additional_packages: []
flatpak_scope: user
auto_prune: true
module_processing: parallel
strict_package_order: false
config_backups:
  enabled: true
  max_backups: 5
system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: timeshift
  snapper_config: root
services:
  enabled: []
  disabled: []
update_hooks:
  pre_update: null
  post_update: null
  behavior: ask
default_apps:
  scope: user
  browser: librewolf
  text_editor: null
  file_manager: null
  terminal: kitty
  video_player: mpv
  audio_player: null
  image_viewer: feh
  pdf_viewer: null
  mime_types: {}
editor: null
aur_helper: yay
